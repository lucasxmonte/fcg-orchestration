apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: fcg
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: users-api
        url: http://users-api-service:80
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: users-route
            paths:
              - /users
            strip_path: true
            preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
              credentials: true
              max_age: 3600

      - name: catalog-api
        url: http://catalog-api-service:80
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: catalog-route
            paths:
              - /catalog
            strip_path: true
            preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
              credentials: true
              max_age: 3600

      - name: payments-api
        url: http://payments-api-service:80
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: payments-route
            paths:
              - /payments
            strip_path: true
            preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.7-ubuntu
          ports:
            - containerPort: 8000   # proxy
            - containerPort: 8001   # admin
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_LOG_LEVEL
              value: info
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-service
  namespace: fcg
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: admin
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kong-nodeport
  namespace: fcg
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30801
  type: NodePort
