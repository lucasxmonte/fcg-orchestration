version: "3.9"

# ═══════════════════════════════════════════════════════════════════
#  FCG Platform — Docker Compose unificado
#  Serviços: PostgreSQL · RabbitMQ · Redis · MongoDB · UsersAPI · CatalogAPI · PaymentsAPI · NotificationsAPI · Prometheus · Grafana
# ═══════════════════════════════════════════════════════════════════

x-rabbitmq-healthcheck: &rabbitmq-healthcheck
  test: ["CMD", "rabbitmq-diagnostics", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U fcg_app -d fcg"]
  interval: 10s
  timeout: 5s
  retries: 5

x-redis-healthcheck: &redis-healthcheck
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5

x-mongodb-healthcheck: &mongodb-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  interval: 10s
  timeout: 5s
  retries: 5

x-common-env: &common-env
  Jwt__Secret: "fcg-super-secret-key-change-in-production-min32chars!"
  Jwt__Issuer: "fcg-users-api"
  Jwt__Audience: "fcg-platform"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__VirtualHost: /
  RabbitMQ__Username: guest
  RabbitMQ__Password: guest
  Redis__ConnectionString: "redis:6379"
  MongoDB__ConnectionString: "mongodb://fcg_app:fcg_app_dev@mongodb:27017"
  MongoDB__DatabaseName: "fcg_reviews"

services:
  # ──────────────────────────────────────────────────────────────────
  #  Infraestrutura
  # ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fcg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fcg
      POSTGRES_USER: fcg_app
      POSTGRES_PASSWORD: fcg_app_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks:
      - fcg-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *rabbitmq-healthcheck
    networks:
      - fcg-net

  redis:
    image: redis:7.2-alpine
    container_name: fcg-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *redis-healthcheck
    networks:
      - fcg-net

  mongodb:
    image: mongo:7.0
    container_name: fcg-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fcg_app
      MONGO_INITDB_ROOT_PASSWORD: fcg_app_dev
      MONGO_INITDB_DATABASE: fcg_reviews
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      <<: *mongodb-healthcheck
    networks:
      - fcg-net

  # ──────────────────────────────────────────────────────────────────
  #  Microsserviços
  # ──────────────────────────────────────────────────────────────────
  users-api:
    build:
      context: ../fcg-users-api
      dockerfile: Dockerfile
    container_name: fcg-users-api
    ports:
      - "8081:8080"     # Swagger: http://localhost:8081/swagger
    environment:
      <<: *common-env
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Postgres: "Host=postgres;Database=fcg;Username=fcg_app;Password=fcg_app_dev"
      SeedAdmin__Email: "admin@fcg.com"
      SeedAdmin__Senha: "TrocarEm@2026"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fcg-net

  catalog-api:
    build:
      context: ../fcg-catalog-api
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "8082:8080"     # Swagger: http://localhost:8082/swagger
    environment:
      <<: *common-env
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Postgres: "Host=postgres;Database=fcg;Username=fcg_app;Password=fcg_app_dev"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fcg-net

  payments-api:
    build:
      context: ../fcg-payments-api
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fcg-net

  notifications-api:
    build:
      context: ../fcg-notifications-api
      dockerfile: Dockerfile
    container_name: fcg-notifications-api
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fcg-net

  # ──────────────────────────────────────────────────────────────────
  #  Observabilidade
  # ──────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: fcg-prometheus
    ports:
      - "9090:9090"   # UI: http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - fcg-net

  grafana:
    image: grafana/grafana:10.4.3
    container_name: fcg-grafana
    ports:
      - "3000:3000"   # UI: http://localhost:3000 (admin/admin)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - fcg-net

# ──────────────────────────────────────────────────────────────────
networks:
  fcg-net:
    driver: bridge

volumes:
  pgdata:
  rabbitmq-data:
  redis-data:
  mongodb-data:
  prometheus-data:
  grafana-data:
